name: Claude On Demand

# Fires when a human types "@claude ..." in an issue, a PR comment,
# or a code review comment.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  # Shared with claude-code-review.yml: one CLAUDE_MODEL variable switches both.
  # See the fuller note in that file. Previously this job pinned no model at all
  # and silently took the action's default.
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
  # Separate from the review cap — answering a mention is a smaller job.
  CLAUDE_ONDEMAND_MAX_TURNS: ${{ vars.CLAUDE_ONDEMAND_MAX_TURNS || '30' }}

jobs:
  claude:
    # Two conditions, both required.
    #  1. the comment actually mentions @claude
    #  2. the author is a repo owner/member/collaborator. This repo is PUBLIC, so
    #     `issue_comment` fires for ANY GitHub user — without this gate an
    #     arbitrary person could spend ANTHROPIC_API_KEY by commenting.
    if: |
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude')
      ) && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Deliberately read-only. Granting `contents: write` here would let this
      # job push, which combined with the public-repo trigger above is a bigger
      # surface than it is worth. The prompt below tells Claude it cannot commit,
      # so users get an explanation instead of a silent 403.
      contents: read
      pull-requests: write
      issues: write
      # NOTE: no `id-token: write`. Both anthropic_api_key and github_token are
      # passed explicitly, so the OIDC token exchange never runs.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Skip the OIDC -> Claude Code GitHub App token exchange; the app is
          # not installed on this repo. See claude-code-review.yml for detail.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          prompt: |
            You are answering an @claude mention on the ThoughtSpot Visual Embed
            SDK. Repo conventions are in `CLAUDE.md`; the documentation rules are
            in `.gemini/styleguide.md`.

            This job has `contents: read` and CANNOT push. You may read the repo,
            explain, diagnose, and write out proposed changes — but do not attempt
            to commit, push, or open a branch; the token will reject it and the
            run will fail with the cause buried in the log.

            When the answer is a code change, reply with the patch in a fenced
            diff or, if it is anchored to specific lines of a PR, a GitHub
            ```suggestion``` block the author can apply in one click. Say plainly
            that you cannot apply it yourself.
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns ${{ env.CLAUDE_ONDEMAND_MAX_TURNS }}
